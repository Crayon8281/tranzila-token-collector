<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>איסוף אמצעי תשלום</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Assistant", sans-serif;
      background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 30px;
      max-width: 500px;
      width: 100%;
    }
    h1 { text-align: center; color: #1a1a1a; margin-top: 0; font-size: 24px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
    .secure-badge {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #f0fdf4; color: #166534;
      padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 13px;
    }
    iframe { width: 100%; height: 600px; border: none; border-radius: 8px; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .error { background: #fee; color: #c33; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
    .missing-id { background: #fef3c7; color: #92400e; padding: 20px; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔒 הזנת אמצעי תשלום</h1>
    <p class="subtitle">הפרטים מוזנים ישירות לחברת הסליקה ולא נשמרים אצלנו</p>
    <div class="secure-badge">🛡️ חיבור מאובטח | תקן PCI-DSS</div>
    <div id="noIdWarning" class="missing-id" style="display:none;">
      ⚠️ חסר מזהה לקוח בקישור.<br>אנא פנה לנציג לקבלת קישור תקין.
    </div>
    <div id="frameWrapper">
      <div id="loading" class="loading">טוען טופס מאובטח...</div>
      <iframe id="tranzilaFrame" src="" onload="document.getElementById('loading').style.display='none'" allow="payment"></iframe>
    </div>
    <div id="error" class="error"></div>
  </div>

  <script>
    // ================== CONFIG ==================
    const TRANZILA_SUPPLIER = "shuma";
    const MAKE_WEBHOOK_URL = "https://hook.eu2.make.com/vq6o613e8yji58gshdtb77rd5qkd7csx";
    // ============================================

    const urlParams = new URLSearchParams(window.location.search);
    const idNumber = urlParams.get('id_number') || urlParams.get('customer_id') || '';
    const phone = urlParams.get('phone') || '';

    if (!idNumber && !phone) {
      document.getElementById('frameWrapper').style.display = 'none';
      document.getElementById('noIdWarning').style.display = 'block';
    } else {
      const SITE_BASE = window.location.origin;
      const paramsObj = {
        sum: '1', currency: '1', cred_type: '1', tranmode: 'VK',
        nologo: '1', lang: 'il',
        response_type: 'token', thtk: '1', myid: idNumber,
        u1: idNumber,                     // ת.ז שלנו (יוחזר בתגובה לזיהוי הלקוח)
        u2: phone,                        // טלפון (אופציונלי לזיהוי גיבוי)
        success_url_address: `${SITE_BASE}/success.html`,
        fail_url_address: `${SITE_BASE}/failure.html`
      };
      const tranzilaParams = new URLSearchParams(paramsObj);
      const iframeUrl = `https://direct.tranzila.com/${TRANZILA_SUPPLIER}/iframenew.php?${tranzilaParams}`;
      document.getElementById('tranzilaFrame').src = iframeUrl;
      console.log('iFrame URL:', iframeUrl);
    }

    window.addEventListener('message', async (event) => {
      if (!event.origin.includes('tranzila.com')) return;
      const data = event.data;
      console.log('Tranzila response:', data);

      if (data && (data.TranzilaTK || data.tk || data.token)) {
        const payload = {
          id_number: idNumber,
          phone: phone,
          tranzila_token: data.TranzilaTK || data.tk || data.token,
          tranzila_expdate: data.expdate || data.expiration || '',
          tranzila_last_4: data.ccno ? String(data.ccno).slice(-4) : '',
          tranzila_card_brand: data.cardtype || data.brand || '',
          response_code: data.Response || data.response || '',
          raw: data
        };
        try {
          await fetch(MAKE_WEBHOOK_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
          });
          window.location.href = 'success.html';
        } catch (err) {
          const errorEl = document.getElementById('error');
          errorEl.textContent = 'שגיאה בשמירה. נסה שוב או פנה לתמיכה.';
          errorEl.style.display = 'block';
        }
      }
    });
  </script>
</body>
</html>
