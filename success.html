<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הושלם בהצלחה</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Assistant", sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%);
      padding: 20px;
    }
    .card {
      background: white; padding: 40px; border-radius: 16px;
      text-align: center; max-width: 500px; width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .check {
      width: 80px; height: 80px; background: #22c55e; color: white;
      border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 40px; margin-bottom: 20px;
      animation: pop 0.4s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    h1 { margin: 10px 0; color: #1a1a1a; font-size: 22px; }
    p { color: #666; line-height: 1.6; }
    .debug {
      margin-top: 30px; padding: 15px;
      background: #f9fafb; border-radius: 8px;
      text-align: right; font-size: 12px;
      color: #374151; max-height: 200px; overflow-y: auto;
      display: none;
    }
    .debug.show { display: block; }
    .debug-toggle {
      margin-top: 20px; background: none; border: none;
      color: #999; font-size: 12px; cursor: pointer;
      text-decoration: underline;
    }
    pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>אמצעי התשלום נשמר בהצלחה</h1>
    <p>תודה! הפרטים שלך מאובטחים ויהיו בשימוש לחיובים עתידיים בלבד.</p>
    <p>ניתן לסגור את החלון.</p>

    <button class="debug-toggle" onclick="document.getElementById('debug').classList.toggle('show')">
      פרטים טכניים
    </button>
    <div id="debug" class="debug">
      <pre id="debugContent"></pre>
    </div>
  </div>

  <script>
    // ================== CONFIG ==================
    const MAKE_WEBHOOK_URL = "https://hook.eu2.make.com/vq6o613e8yji58gshdtb77rd5qkd7csx";
    // ============================================

    const params = new URLSearchParams(window.location.search);
    const data = {};
    for (const [key, value] of params.entries()) {
      data[key] = value;
    }

    document.getElementById('debugContent').textContent = JSON.stringify(data, null, 2);
    console.log('Tranzila callback params:', data);

    // הערה: שמירת הטוקן ל-Make מתבצעת ברקע דרך notify_url של Tranzila,
    // לא מהדף הזה. הדף משמש רק כמשוב ויזואלי למשתמש.
  </script>
</body>
</html>
