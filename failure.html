<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>השמירה נכשלה</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Assistant", sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 100%);
      padding: 20px;
    }
    .card {
      background: white; padding: 40px; border-radius: 16px;
      text-align: center; max-width: 420px; width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .x-mark {
      width: 80px; height: 80px; background: #ef4444; color: white;
      border-radius: 50%; display: inline-flex;
      align-items: center; justify-content: center;
      font-size: 40px; margin-bottom: 20px;
      animation: shake 0.5s ease-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    h1 { margin: 10px 0; color: #1a1a1a; font-size: 22px; }
    p { color: #666; line-height: 1.6; }
    .retry-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #2563eb; }
    .support {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="x-mark">✕</div>
    <h1>השמירה לא הושלמה</h1>
    <p>לא הצלחנו לאמת את אמצעי התשלום.<br>ייתכן שפרטי הכרטיס שגויים או שהכרטיס לא תקף.</p>
    <a href="javascript:history.back()" class="retry-btn">נסה שוב</a>
    <p class="support">אם הבעיה נמשכת, פנה לתמיכה</p>
  </div>
</body>
</html>
